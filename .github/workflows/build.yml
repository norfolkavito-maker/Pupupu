name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch zapret-win-bundle runtime (for portable release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime\zapret | Out-Null
          $zip = "zapret-win-bundle.zip"
          Invoke-WebRequest -Uri "https://github.com/bol-van/zapret-win-bundle/archive/refs/heads/master.zip" -OutFile $zip
          Expand-Archive -Force $zip -DestinationPath .
          $src = Get-ChildItem -Directory | Where-Object { $_.Name -like "zapret-win-bundle-*" } | Select-Object -First 1
          if (-not $src) { throw "cannot find extracted zapret-win-bundle dir" }
          $sub = Join-Path $src.FullName "zapret-winws"
          if (-not (Test-Path $sub)) { throw "cannot find zapret-winws subdir" }
          Copy-Item -Recurse -Force (Join-Path $sub "*") runtime\zapret\

          # blockcheck scripts live in the repo root of zapret-win-bundle.
          $blockcheck = Join-Path $src.FullName "blockcheck"
          if (Test-Path $blockcheck) {
            New-Item -ItemType Directory -Force -Path runtime\zapret\blockcheck | Out-Null
            Copy-Item -Recurse -Force (Join-Path $blockcheck "*") runtime\zapret\blockcheck\
          }

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "*_unittest.py"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --uac-admin --name DedZapret --paths . app\zapret_manager\__main__.py

      - name: Prepare portable bundle
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force bundle -ErrorAction SilentlyContinue | Out-Null

          # User portable layout
          New-Item -ItemType Directory -Force -Path bundle\DedZapret | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\runtime\zapret | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\builtin | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\custom | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\generated | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\logs | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\state | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\backups | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\profiles | Out-Null

          Copy-Item -Force dist\DedZapret.exe bundle\DedZapret\
          Copy-Item -Force README_FIRST.txt bundle\DedZapret\

          # configs go inside DedZapretData
          Copy-Item -Force config.yaml bundle\DedZapret\DedZapretData\config.yaml
          Copy-Item -Force sources.yaml bundle\DedZapret\DedZapretData\sources.yaml

          if (Test-Path runtime\zapret) {
            Copy-Item -Recurse -Force runtime\zapret\* bundle\DedZapret\DedZapretData\runtime\zapret\
          }
          if (Test-Path data\strategies\builtin) {
            Copy-Item -Recurse -Force data\strategies\builtin\* bundle\DedZapret\DedZapretData\data\strategies\builtin\
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DedZapret-portable
          path: bundle

      - name: Make portable zip
        shell: pwsh
        run: |
          if (Test-Path DedZapret-portable.zip) { Remove-Item -Force DedZapret-portable.zip }
          Compress-Archive -Path bundle\DedZapret -DestinationPath DedZapret-portable.zip

      - name: Make dev/source zip
        shell: pwsh
        run: |
          if (Test-Path DedZapret-dev-source.zip) { Remove-Item -Force DedZapret-dev-source.zip }
          Compress-Archive -Path app,tests,requirements.txt,run.bat,config.yaml,sources.yaml,README.md -DestinationPath DedZapret-dev-source.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DedZapret-portable.zip
            DedZapret-dev-source.zip
