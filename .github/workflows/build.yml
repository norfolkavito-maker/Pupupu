name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Use tag name as VERSION for releases. For branch builds keep a stable
      # name so artifacts don't spam versioned files.
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'snapshot' }}
      DEDZAPRET_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch zapret-win-bundle runtime (for portable release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime\zapret | Out-Null
          $zip = "zapret-win-bundle.zip"
          Invoke-WebRequest -Uri "https://github.com/bol-van/zapret-win-bundle/archive/refs/heads/master.zip" -OutFile $zip
          Expand-Archive -Force $zip -DestinationPath .
          $src = Get-ChildItem -Directory | Where-Object { $_.Name -like "zapret-win-bundle-*" } | Select-Object -First 1
          if (-not $src) { throw "cannot find extracted zapret-win-bundle dir" }
          $sub = Join-Path $src.FullName "zapret-winws"
          if (-not (Test-Path $sub)) { throw "cannot find zapret-winws subdir" }
          Copy-Item -Recurse -Force (Join-Path $sub "*") runtime\zapret\

          # blockcheck scripts live in the repo root of zapret-win-bundle.
          $blockcheck = Join-Path $src.FullName "blockcheck"
          if (Test-Path $blockcheck) {
            New-Item -ItemType Directory -Force -Path runtime\zapret\blockcheck | Out-Null
            Copy-Item -Recurse -Force (Join-Path $blockcheck "*") runtime\zapret\blockcheck\
          }

      - name: Fetch sing-box runtime (windows amd64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime\singbox | Out-Null

          $api = "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $release = Invoke-RestMethod -Uri $api
          $asset = $release.assets | Where-Object { $_.name -match "windows-amd64\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "cannot find sing-box windows-amd64 zip in latest release" }

          $zip = "sing-box-windows-amd64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Force $zip -DestinationPath runtime\singbox

          $exe = Get-ChildItem -Path runtime\singbox -Recurse -File -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $exe) { throw "sing-box.exe not found after extraction" }
          New-Item -ItemType Directory -Force -Path runtime\singbox\bin\sing-box | Out-Null
          Copy-Item -Force $exe.FullName runtime\singbox\bin\sing-box\sing-box.exe

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "*_unittest.py"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --uac-admin --name DedZapret --paths . app\zapret_manager\__main__.py

      - name: Prepare portable bundle
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force bundle -ErrorAction SilentlyContinue | Out-Null

          # User portable layout
          New-Item -ItemType Directory -Force -Path bundle\DedZapret | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\runtime\zapret | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\builtin | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\custom | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\strategies\generated | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\logs | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\state | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\backups | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\profiles | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\DedZapretData\data\lists | Out-Null
          New-Item -ItemType Directory -Force -Path bundle\DedZapret\bin\sing-box | Out-Null

          Copy-Item -Force dist\DedZapret.exe bundle\DedZapret\
          Copy-Item -Force README_FIRST.txt bundle\DedZapret\

          # configs go inside DedZapretData
          Copy-Item -Force config.yaml bundle\DedZapret\DedZapretData\config.yaml
          Copy-Item -Force sources.yaml bundle\DedZapret\DedZapretData\sources.yaml

          if (Test-Path runtime\zapret) {
            Copy-Item -Recurse -Force runtime\zapret\* bundle\DedZapret\DedZapretData\runtime\zapret\
          }
          if (Test-Path data\strategies\builtin) {
            Copy-Item -Recurse -Force data\strategies\builtin\* bundle\DedZapret\DedZapretData\data\strategies\builtin\
          }
          if (Test-Path data\lists) {
            Copy-Item -Recurse -Force data\lists\* bundle\DedZapret\DedZapretData\data\lists\
          }
          if (Test-Path runtime\singbox\bin\sing-box\sing-box.exe) {
            Copy-Item -Force runtime\singbox\bin\sing-box\sing-box.exe bundle\DedZapret\bin\sing-box\sing-box.exe
          }

      - name: Validate portable bundle contains required assets
        shell: pwsh
        run: |
          $root = "bundle\DedZapret\DedZapretData"
          if (-not (Test-Path "$root\data\lists")) { throw "missing $root\\data\\lists" }
          foreach ($f in @("google.txt","exclude.txt")) {
            if (-not (Test-Path "$root\data\lists\$f")) { throw "missing list file: $f" }
          }
          if (-not (Test-Path "bundle\DedZapret\bin\sing-box\sing-box.exe")) {
            throw "missing bundle\\DedZapret\\bin\\sing-box\\sing-box.exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DedZapret-portable-${{ env.VERSION }}
          path: bundle

      - name: Make portable zip
        shell: pwsh
        run: |
          $out = "DedZapret-portable-${{ env.VERSION }}.zip"
          if (Test-Path $out) { Remove-Item -Force $out }
          Compress-Archive -Path bundle\DedZapret -DestinationPath $out

      - name: Make dev/source zip
        shell: pwsh
        run: |
          $out = "DedZapret-dev-source-${{ env.VERSION }}.zip"
          if (Test-Path $out) { Remove-Item -Force $out }
          Compress-Archive -Path app,tests,requirements.txt,run.bat,config.yaml,sources.yaml,README.md -DestinationPath $out

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DedZapret-portable-${{ env.VERSION }}.zip
            DedZapret-dev-source-${{ env.VERSION }}.zip
