name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s tests -p "*_unittest.py"

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --name ZapretManager --paths app app\\zapret_manager\\__main__.py

      - name: Prepare portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item -Force dist\\ZapretManager.exe bundle\\
          Copy-Item -Force run.bat bundle\\
          Copy-Item -Force config.yaml bundle\\
          Copy-Item -Force sources.yaml bundle\\
          Copy-Item -Force README.md bundle\\
          if (Test-Path data\\strategies\\builtin) {
            Copy-Item -Recurse -Force data\\strategies\\builtin bundle\\data\\strategies\\builtin
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretManager-portable
          path: bundle

