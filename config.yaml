# Основные настройки (не удаляй файл; лучше меняй значения).
app:
  language: ru
  updates:
    check_on_start: true
    apply_mode: ask   # ask | auto | manual

zapret:
  mode: interactive  # interactive | task (autostart via schtasks)
  service_name: wowManagerAutostart
  runtime_dir: runtime/zapret
  selected_strategy: ""   # имя стратегии без расширения
  discord_profile: ""     # Dv1..DvN (опционально)
  games_profile: ""       # Gv1..Gv4 (опционально)
  bundle_path: ".\\runtime\\zapret"
  winws_path: ".\\runtime\\zapret\\winws.exe"
  blockcheck_path: ".\\runtime\\zapret\\blockcheck\\blockcheck.cmd"
  active_strategy: "v7"
  run_mode: "process"
  autostart: false
  require_admin: true

paths:
  hosts_file: "C:\\Windows\\System32\\drivers\\etc\\hosts"
  fake_files_dir: ".\\runtime\\zapret\\files\\fake"
  lists_dir: ".\\data\\lists"
  strategies_dir: ".\\data\\strategies"
  logs_dir: ".\\data\\logs"
  backup_dir: ".\\data\\backup"

network:
  adapter_name: ""        # если пусто — попытаться определить автоматически (Windows)
  flush_dns_after_hosts_change: true
  enable_tcp_timestamps_if_needed: false

game_launcher:
  enabled: true
  auto_stop_zapret_on_game_exit: true

doh:
  enabled: false
  profile: default
  listen_addr: 127.0.0.1
  listen_port: 5053

diagnostics:
  enabled: false
  record_console_io: true
  record_subprocess: true
  max_text_len: 8000
  redact_paths: false
  reporting:
    mode: github_issue
    github_repo: norfolkavito-maker/Pupupu