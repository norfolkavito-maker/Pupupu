warnings:
- Использует плейсхолдеры {GAME_FILTER_TCP}/{GAME_FILTER_UDP}; сборщик профиля должен подставлять игровые порты или удалять пустые фильтры.
- Использует ipset-all.txt; требуется корректный ipset список для IP-фильтра.
- Содержит Discord/STUN слой.
- Содержит Google/YouTube слой через list-google.txt.
