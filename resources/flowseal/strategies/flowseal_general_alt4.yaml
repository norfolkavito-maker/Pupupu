required_assets:
  fake:
  - quic_initial_dbankcloud_ru.bin
  - quic_initial_www_google_com.bin
  - stun.bin
  - tls_clienthello_max_ru.bin
  - tls_clienthello_www_google_com.bin
  lists:
  - ipset-all.txt
  - ipset-exclude-user.txt
  - ipset-exclude.txt
  - list-exclude-user.txt
  - list-exclude.txt
  - list-general-user.txt
  - list-general.txt
  - list-google.txt
tags:
- alt
- discord
- flowseal
- games
- general
- mixed
- youtube
warnings:
- Использует плейсхолдеры {GAME_FILTER_TCP}/{GAME_FILTER_UDP}; сборщик профиля должен подставлять игровые порты или удалять пустые фильтры.
- Использует ipset-all.txt; требуется корректный ipset список для IP-фильтра.
- Содержит Discord/STUN слой.
- Содержит Google/YouTube слой через list-google.txt.
conflicts:
  may_overlap_layers:
  - youtube
  - discord
  - games
  - ipset
  requires_profile_composer: true
