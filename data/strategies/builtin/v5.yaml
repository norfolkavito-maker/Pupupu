name: v5
engine: winws
kind: base
args:
  - --filter-tcp=443
  - --hostlist-exclude={LISTS}\exclude.txt
  - --dpi-desync=fake,fakeddisorder
  - --dpi-desync-split-pos=1
  - --dpi-desync-fake-tls={FAKE}\stun.bin
  - --dpi-desync-fake-tls-mod=none
  - --dpi-desync-fakedsplit-pattern={FAKE}\tls_clienthello_www_google_com.bin
  - --dpi-desync-fooling=badseq,badsum
  - --dpi-desync-badseq-increment=0
  - --new
  - --filter-udp=443
  - --hostlist-exclude={LISTS}\exclude.txt
  - --dpi-desync=fake
  - --dpi-desync-repeats=6
  - --dpi-desync-fake-quic={FAKE}\quic_initial_www_google_com.bin
winws_params: []
description: "v5 — fake+fakeddisorder + UDP fake-quic"
category: general
upstream: stressozz
