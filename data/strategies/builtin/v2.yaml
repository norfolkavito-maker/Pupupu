name: v2
engine: winws
kind: base
args:
  - --filter-tcp=443
  - --hostlist-exclude={LISTS}\exclude.txt
  - --dpi-desync=fake,fakeddisorder
  - --dpi-desync-split-pos=10,midsld
  - --dpi-desync-fake-tls={FAKE}\tls_clienthello_www_google_com.bin
  - --dpi-desync-fake-tls-mod=rnd,dupsid,sni=fonts.google.com
  - --dpi-desync-fake-tls=0x0F0F0F0F
  - --dpi-desync-fake-tls-mod=none
  - --dpi-desync-fakedsplit-pattern={FAKE}\tls_clienthello_vk_com.bin
  - --dpi-desync-split-seqovl=336
  - --dpi-desync-split-seqovl-pattern={FAKE}\tls_clienthello_gosuslugi_ru.bin
  - --dpi-desync-fooling=badseq,badsum
  - --dpi-desync-badseq-increment=0
  - --new
  - --filter-udp=443
  - --hostlist-exclude={LISTS}\exclude.txt
  - --dpi-desync=fake
  - --dpi-desync-repeats=6
  - --dpi-desync-fake-quic={FAKE}\quic_initial_www_google_com.bin
winws_params: []
description: "v2 — fake+fakeddisorder + UDP fake-quic"
category: general
upstream: stressozz
