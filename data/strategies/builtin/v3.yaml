name: v3
engine: winws
kind: base
args:
  - --filter-tcp=443
  - --hostlist={LISTS}\google.txt
  - --ip-id=zero
  - --dpi-desync=multisplit
  - --dpi-desync-split-seqovl=681
  - --dpi-desync-split-pos=1
  - --dpi-desync-split-seqovl-pattern={FAKE}\tls_clienthello_www_google_com.bin
